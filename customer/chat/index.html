<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Describe a household job and Doorstep will match you with local providers." />
    <title>Doorstep ? Find the right help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .suite-menu-container { position: relative; display: inline-block; }
      .suite-btn { background: var(--glass-fill-strong); border: 1px solid var(--hairline); color: var(--color-ink); border-radius: var(--radius-full); padding: 6px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
      .suite-btn:hover { border-color: var(--color-accent); }
      .suite-dropdown { position: absolute; top: calc(100% + 8px); right: 0; width: 240px; background: var(--color-page); border: 1px solid var(--hairline); border-radius: var(--radius-md); box-shadow: var(--shadow-lift); z-index: 100; padding: 6px 0; }
      .suite-dropdown a, .suite-dropdown button { display: block; width: 100%; text-align: left; padding: 8px 14px; color: var(--color-ink); font-size: 0.82rem; text-decoration: none; border: none; background: transparent; cursor: pointer; }
      .suite-dropdown a:hover, .suite-dropdown button:hover { background: var(--glass-fill); color: var(--color-accent-text); }
      .hidden { display: none !important; }
      .chat-thread { padding-bottom: 160px !important; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <span class="brand" onclick="window.location.href='../'" style="cursor: pointer;">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 10.5 12 3.5l8.5 7" />
            <path d="M5.5 9.4V20h13V9.4" />
            <path d="M12 20v-4.2" />
            <path d="M10.1 13.1a2.6 2.6 0 0 1 3.6-3.1l-1.3 1.3 1.4 1.4 1.3-1.3a2.6 2.6 0 0 1-3.1 3.6" />
          </svg>
          Doorstep
        </span>

        <div class="header-actions">
          <div class="suite-menu-container">
            <button class="suite-btn" id="suite-btn" onclick="toggleSuiteMenu()">
              <span>Products Suite</span> ?
            </button>
            <div class="suite-dropdown hidden" id="suite-dropdown">
              <a href="../provider/">?? Product A (Provider)</a>
              <a href="../">?? Product B (Customer App)</a>
              <a href="./" style="font-weight: 700; color: var(--color-accent);">?? Product C (AI Matcher)</a>
              <a href="../admin/">?? Product D (Safety Ops)</a>
            </div>
          </div>

          <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle colour theme">
            <span class="theme-toggle-glyph" id="theme-glyph" aria-hidden="true">??</span>
          </button>
          <button class="clear-chat" id="clear-chat" type="button" onclick="handleClearChat()" aria-label="Clear conversation">
            <span aria-hidden="true">Clear</span>
          </button>
        </div>
      </header>

      <div class="chat-thread" id="chat-thread">
        <div class="empty-state" id="empty-state">
          <p class="empty-prompt">Tell me what needs doing around the house.</p>
          <div class="example-chips">
            <button class="example-chip" onclick="handleExampleChip('Looking for someone to come clean my one bedroom apartment')">Looking for someone to come clean my one bedroom apartment</button>
            <button class="example-chip" onclick="handleExampleChip('Kitchen tap drips constantly and the shutoff valve underneath is seized')">Kitchen tap drips constantly and the shutoff valve underneath is seized</button>
            <button class="example-chip" onclick="handleExampleChip('Need two guys to help load a U-Haul truck on Sunday')">Need two guys to help load a U-Haul truck on Sunday</button>
            <button class="example-chip" onclick="handleExampleChip('Gutters are overflowing and there are leaves all over the lawn')">Gutters are overflowing and there are leaves all over the lawn</button>
            <button class="example-chip" onclick="handleExampleChip('Need a ceiling fan installed where an old light fixture is')">Need a ceiling fan installed where an old light fixture is</button>
          </div>
        </div>
        <div id="messages-container"></div>
      </div>

      <div class="composer">
        <div class="filter-chips" id="filter-chips"></div>
        <form class="chat-input-bar" onsubmit="handleFormSubmit(event)">
          <input type="text" id="chat-input" placeholder="Tell me what needs doing..." autocomplete="off" />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
    </div>

    <script src="../data.js"></script>
    <script src="../chatbot-engine.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
