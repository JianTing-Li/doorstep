<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doorstep Product A: Provider Workspace for creating listings and managing incoming bookings." />
    <title>TaskLocal &middot; Provider Workspace (Product A)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .suite-menu-container { position: relative; display: inline-block; }
      .suite-btn { background: var(--surface-soft); border: 1px solid var(--border-warm); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
      .suite-btn:hover { border-color: var(--forest); }
      .suite-dropdown { position: absolute; top: calc(100% + 8px); right: 0; width: 250px; background: white; border: 1px solid var(--border-warm); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 100; padding: 6px 0; }
      .suite-dropdown a { display: block; width: 100%; text-align: left; padding: 9px 15px; color: var(--text); font-size: 12px; text-decoration: none; }
      .suite-dropdown a:hover { background: var(--sage-soft); color: var(--forest-light); }
      .provider-select-wrap { margin-left: 8px; }
      .provider-select-wrap select { background: var(--surface-soft); border: 1px solid var(--border-warm); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; color: var(--text); cursor: pointer; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div id="provider-root"></div>
    </main>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
