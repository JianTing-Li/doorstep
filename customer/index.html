<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doorstep — browse and book trusted local home-service providers in Portland, OR." />
    <title>Doorstep — Customer App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Doorstep shared shell (Phase 2/4). Injected via an inline script,
         not plain <link>/<script src> tags: Vite's HTML asset pipeline tries
         to resolve and bundle any local src/href it finds and silently drops
         what it can't — see provider/index.html for the full explanation.
         Leaflet above is a full external origin URL, which Vite leaves
         alone, so it doesn't need this treatment. -->
    <script>
      (function () {
        var tokens = document.createElement("link");
        tokens.rel = "stylesheet";
        tokens.href = "/shared/tokens.css";
        document.head.appendChild(tokens);

        var switcherCss = document.createElement("link");
        switcherCss.rel = "stylesheet";
        switcherCss.href = "/shared/switcher.css";
        document.head.appendChild(switcherCss);

        var headerCss = document.createElement("link");
        headerCss.rel = "stylesheet";
        headerCss.href = "/shared/header.css";
        document.head.appendChild(headerCss);

        // header.js mounts the switcher pill itself, so only this is loaded.
        var headerJs = document.createElement("script");
        headerJs.type = "module";
        headerJs.src = "/shared/header.js";
        document.head.appendChild(headerJs);
      })();
    </script>
  </head>
  <body>
    <div id="doorstep-header" data-label="Portland, OR"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
